name: Bug
description: Report a defect or regression
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-paragraph description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact, minimal steps. Include map, scene, or branch when relevant.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include logs, stack traces, or screenshots if available.
    validations:
      required: true

  - type: textarea
    id: regression-test
    attributes:
      label: Regression test
      description: What test will fail before the fix and pass after it? Name the tier and suite.
      placeholder: |
        - Failing test to add: tests/unit/... or tests/integration/...
        - Manual: only if automation is genuinely impractical
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Godot version, OS, renderer, and anything else that might matter.
      placeholder: |
        - Godot: 4.7.2
        - OS:
        - Renderer:
    validations:
      required: false
